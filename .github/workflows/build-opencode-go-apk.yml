name: Build APK (OpenCode Go)

# Builds an installable arm64 APK from this branch, with the OpenCode Go
# session-header support (src/android/.../provider/OpencodeSession.kt).
on:
  push:
    branches:
      - fix/opencode-go-clean
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;28.0.12433566" "cmake;3.22.1"
          sdkmanager --list_installed

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Copy provider customization template
        run: |
          cp src/android/app/provider-customization.properties.example \
             src/android/app/provider-customization.properties

      - name: Build rclone AAR
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.0.12433566
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euxo pipefail
          mkdir -p src/android/app/libs
          chmod +x deps/build_rclone_android.sh
          if ./deps/build_rclone_android.sh; then
            echo "RCLONE_BUILD=ok" | tee -a "$GITHUB_ENV"
            cp deps/build/rclone/rclone.aar src/android/app/libs/rclone.aar
          else
            echo "RCLONE_BUILD=stub (cloud backup destinations will not work)" | tee -a "$GITHUB_ENV"
            python3 -c "import zipfile; z=zipfile.ZipFile('src/android/app/libs/rclone.aar','w'); z.writestr('AndroidManifest.xml','<manifest package=\"com.openminis.rclone\"/>'); z.close()"
          fi
          ls -lh src/android/app/libs/rclone.aar

      - name: Build sandbox (proot + Alpine rootfs)
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.0.12433566
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          chmod +x deps/build_proot.sh scripts/prepare_android_sandbox.sh
          ./deps/build_proot.sh
          ./scripts/prepare_android_sandbox.sh

      - name: Build APK (release, falls back to debug)
        working-directory: src/android
        run: |
          set -o pipefail
          if ./gradlew :app:assembleRelease --stacktrace --no-daemon; then
            echo "APK_VARIANT=release" >> "$GITHUB_ENV"
          else
            echo "release build failed — falling back to debug" >&2
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
            echo "APK_VARIANT=debug" >> "$GITHUB_ENV"
          fi

      - name: Show build status
        run: |
          echo "rclone: ${RCLONE_BUILD:-unknown} | apk: ${APK_VARIANT:-unknown}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Minis-opencode-go-arm64
          path: |
            src/android/app/build/outputs/apk/release/*.apk
            src/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90
